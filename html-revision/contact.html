<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | My HTML Portfolio</title>
    <meta name="description" content="Contact page for my HTML revision portfolio.">
</head>
<body>
    <header>
        <h1>Contact</h1>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </nav>
    </header>
    <main>
        <h2>Send a Message</h2>
        <p>Practice only: sending requires a server endpoint at /contact.</p>
        <form action="/contact" method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name"
                   minlength="3" maxlength="100" autocomplete="name" required>
        
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   autocomplete="email" required>
        
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
        
            <button type="submit">Send Message</button>
        </form>
    </main>
    <footer><p>&copy; 2026 My Website</p></footer>
</body>
</html>
